<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMC Analytics Pro - Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
        
        .glass-panel {
            background: rgba(19, 23, 34, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-[#0B0E14] text-gray-200 font-sans relative h-screen overflow-hidden selection:bg-blue-500/30">
    
    <!-- Navbar -->
    <nav class="glass-panel px-6 py-3 flex justify-between items-center shrink-0 z-20 relative shadow-lg">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-blue-500/30">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
            </div>
            <div class="text-xl font-extrabold bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent tracking-tight">
                SMC Terminal
            </div>
        </div>
        <div class="flex space-x-6 text-sm font-medium items-center">
            <button class="text-cyan-400 border-b-2 border-cyan-400 pb-1 transition">Workspace</button>
            <button class="text-gray-400 hover:text-gray-200 transition">Journal</button>
            
            <div id="user-info" class="hidden flex items-center gap-3 border-l border-gray-700 pl-4 ml-2">
                <div class="flex items-center gap-2 bg-white/5 pr-3 pl-1 py-1 rounded-full border border-white/10">
                    <div class="w-6 h-6 rounded-full bg-gradient-to-r from-indigo-500 to-purple-500 flex items-center justify-center text-[10px] text-white font-bold">U</div>
                    <span id="user-email" class="text-gray-200 font-semibold text-xs tracking-wide"></span>
                </div>
                <button onclick="signOut()" class="text-gray-400 hover:text-red-400 text-xs transition p-1" title="Đăng xuất">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
            <button id="btn-show-login" onclick="toggleAuthModal(true)" class="bg-white/10 hover:bg-white/20 border border-white/10 px-5 py-2 rounded-xl transition shadow-lg backdrop-blur-sm font-semibold">Đăng nhập</button>
        </div>
    </nav>

    <!-- Layout chính: Cột trái Full Biểu đồ, Cột phải Full Cộng đồng & Đăng bài -->
    <div class="flex flex-col lg:flex-row h-[calc(100vh-64px)] p-3 gap-4 overflow-hidden relative z-10">
        
        <!-- CỘT TRÁI: Biểu đồ toàn màn hình -->
        <div class="w-full lg:w-2/3 flex flex-col h-full">
            <div class="glass-panel rounded-2xl p-1 h-full shadow-2xl overflow-hidden group">
                <div class="tradingview-widget-container" style="height:100%;width:100%; border-radius: 12px; overflow: hidden;">
                  <div id="tradingview_7b27f" style="height:calc(100% - 32px);width:100%"></div>
                  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
                  <script type="text/javascript">
                  new TradingView.widget({
                  "autosize": true,
                  "symbol": "OANDA:XAGUSD",
                  "interval": "60",
                  "timezone": "Asia/Ho_Chi_Minh",
                  "theme": "dark",
                  "style": "1",
                  "locale": "vi_VN",
                  "enable_publishing": false,
                  "backgroundColor": "#131722",
                  "gridColor": "rgba(255, 255, 255, 0.05)",
                  "hide_top_toolbar": false,
                  "hide_legend": false,
                  "save_image": true,
                  "container_id": "tradingview_7b27f",
                  "toolbar_bg": "#131722",
                  "allow_symbol_change": true,
                  "details": true,
                  "watchlist": ["OANDA:XAGUSD", "TVC:COPPER", "TVC:PLATINUM", "OANDA:XAUUSD"]
                });
                  </script>
                </div>
            </div>
        </div>

        <!-- CỘT PHẢI: Feed, Leaderboard & Form Đăng lệnh tích hợp -->
        <div class="w-full lg:w-1/3 glass-panel rounded-2xl shadow-2xl flex flex-col h-full overflow-hidden">
            <!-- Tabs chuyển đổi -->
            <div class="flex border-b border-white/10 shrink-0 p-1 bg-black/20">
                <button onclick="switchTab('feed')" id="tab-feed" class="flex-1 py-2.5 mx-1 text-sm font-semibold bg-white/10 text-white rounded-lg transition shadow-sm">
                    Live Feed <span class="ml-1.5 inline-block w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)] animate-pulse"></span>
                </button>
                <button onclick="switchTab('rank')" id="tab-rank" class="flex-1 py-2.5 mx-1 text-sm font-medium text-gray-400 hover:text-gray-200 hover:bg-white/5 rounded-lg transition">
                    Leaderboard
                </button>
            </div>
            
            <!-- Nội dung Tab Feed: Danh sách bài đăng -->
            <div id="content-feed" class="p-3 overflow-y-auto flex-1 custom-scrollbar">
                <div id="posts-container" class="space-y-3">
                    <div class="animate-pulse flex space-x-4 p-4 bg-white/5 rounded-xl border border-white/5">
                        <div class="flex-1 space-y-4 py-1">
                            <div class="h-2 bg-gray-600 rounded w-3/4"></div>
                            <div class="space-y-2">
                                <div class="h-2 bg-gray-600 rounded"></div>
                                <div class="h-2 bg-gray-600 rounded w-5/6"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Nội dung Tab Leaderboard -->
            <div id="content-rank" class="p-3 overflow-y-auto flex-1 hidden custom-scrollbar">
                <div class="bg-gradient-to-br from-indigo-900/40 to-purple-900/40 rounded-xl p-5 text-center border border-indigo-500/20 mb-4 shadow-inner">
                    <h4 class="text-indigo-300 font-extrabold mb-1 tracking-wide">TOP ANALYSTS</h4>
                    <p class="text-[11px] text-gray-400">Hệ thống quét TP/SL tự động để cập nhật Winrate</p>
                </div>
                
                <div class="flex items-center justify-between bg-black/30 p-3.5 rounded-xl border border-white/5 mb-3">
                    <div class="flex items-center gap-4">
                        <span class="text-2xl font-black text-yellow-500">1</span>
                        <div>
                            <div class="text-sm font-bold text-gray-100">@smart_money_bot</div>
                            <div class="text-xs text-gray-400 mt-0.5">Winrate: <span class="text-green-400 font-bold">78%</span></div>
                        </div>
                    </div>
                    <span class="bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 text-[10px] px-2.5 py-1 rounded-full font-bold">Pro</span>
                </div>
            </div>

            <!-- FORM ĐĂNG BÀI & TÍN HIỆU (Nằm gọn ở đáy cột phải) -->
            <div class="p-3 border-t border-white/10 bg-black/30 shrink-0 relative">
                <div id="login-overlay" class="absolute inset-0 bg-[#0B0E14]/80 backdrop-blur-sm flex items-center justify-center z-10 hidden">
                    <button onclick="toggleAuthModal(true)" class="bg-gradient-to-r from-blue-600 to-cyan-500 px-6 py-2 rounded-xl text-xs font-bold shadow-lg">Đăng nhập để thảo luận</button>
                </div>

                <textarea id="input-content" class="w-full bg-black/50 border border-white/10 rounded-xl p-2.5 text-xs text-gray-200 focus:outline-none focus:border-cyan-500/50 resize-none" rows="2" placeholder="Chia sẻ nhận định FVG, cấu trúc giá..."></textarea>
                
                <div id="forward-test-form" class="mt-2 p-2.5 bg-black/40 border border-white/5 rounded-xl hidden">
                    <div class="grid grid-cols-3 gap-2 text-xs mb-2">
                        <select id="input-symbol" class="bg-white/5 border border-white/10 rounded-lg p-1 text-white">
                            <option value="XAGUSD" class="bg-gray-900">XAGUSD</option>
                            <option value="XAUUSD" class="bg-gray-900">XAUUSD</option>
                            <option value="COPPER" class="bg-gray-900">COPPER</option>
                        </select>
                        <select id="input-type" class="bg-white/5 border border-white/10 rounded-lg p-1 text-white">
                            <option value="LONG" class="bg-gray-900">LONG</option>
                            <option value="SHORT" class="bg-gray-900">SHORT</option>
                        </select>
                        <input type="number" id="input-entry" placeholder="Entry" class="bg-white/5 border border-white/10 rounded-lg p-1 text-white font-mono">
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <input type="number" id="input-sl" placeholder="Stop Loss" class="bg-white/5 border border-white/10 rounded-lg p-1 text-white font-mono">
                        <input type="number" id="input-tp" placeholder="Take Profit" class="bg-white/5 border border-white/10 rounded-lg p-1 text-white font-mono">
                    </div>
                </div>

                <div class="mt-2 flex justify-between items-center">
                    <button onclick="document.getElementById('forward-test-form').classList.toggle('hidden')" class="text-[11px] text-gray-400 hover:text-white flex items-center gap-1 bg-white/5 px-2.5 py-1 rounded-lg border border-white/5">
                        + Lệnh Test
                    </button>
                    <button id="btn-submit" onclick="submitPost()" class="bg-gradient-to-r from-blue-600 to-cyan-500 px-5 py-1.5 rounded-lg text-xs font-bold shadow-md hover:opacity-90 transition-all">Đăng Bài</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Auth -->
    <div id="auth-modal" class="fixed inset-0 bg-[#0B0E14]/80 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="glass-panel p-8 rounded-3xl shadow-2xl w-96 relative border border-white/10">
            <button onclick="toggleAuthModal(false)" class="absolute top-4 right-4 text-gray-500 hover:text-white">&times;</button>
            <div class="text-center mb-6">
                <h2 id="auth-title" class="text-xl font-extrabold">Xác Thực Tài Khoản</h2>
            </div>
            <div class="space-y-4">
                <input type="email" id="auth-email" placeholder="Email định danh" class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-sm text-white outline-none focus:border-cyan-500">
                <input type="password" id="auth-pass" placeholder="Mật khẩu" class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-sm text-white outline-none focus:border-cyan-500">
                <button id="btn-auth-action" onclick="handleAuth()" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 py-3 rounded-xl font-bold">Tiếp Tục</button>
            </div>
            <div class="mt-4 text-center text-xs text-gray-400">
                <span id="auth-switch-text">Chưa có tài khoản?</span> 
                <button onclick="switchAuthMode()" id="auth-switch-btn" class="text-cyan-400 font-bold ml-1">Đăng ký</button>
            </div>
            <div id="auth-error" class="mt-3 bg-red-500/10 text-red-400 text-xs p-2 rounded hidden text-center"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://spbiokurzoxupmksraoy.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_SZjk9POzWzoqoZbvoaCSfg_a9btQLym';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let currentUser = null;
        let isLoginMode = true; 

        async function checkSession() {
            const { data } = await supabaseClient.auth.getSession();
            if (data.session) {
                currentUser = data.session.user;
                document.getElementById('btn-show-login').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('user-email').innerText = '@' + currentUser.email.split('@')[0];
                document.getElementById('login-overlay').classList.add('hidden');
            } else {
                currentUser = null;
                document.getElementById('btn-show-login').classList.remove('hidden');
                document.getElementById('user-info').classList.add('hidden');
                document.getElementById('login-overlay').classList.remove('hidden');
            }
            fetchPosts();
        }

        function toggleAuthModal(show) {
            const modal = document.getElementById('auth-modal');
            show ? (modal.classList.remove('hidden'), modal.classList.add('flex')) : (modal.classList.add('hidden'), modal.classList.remove('flex'));
        }

        function switchAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? 'Xác Thực Tài Khoản' : 'Đăng Ký Tài Khoản';
            document.getElementById('btn-auth-action').innerText = isLoginMode ? 'Tiếp Tục' : 'Đăng Ký';
            document.getElementById('auth-switch-text').innerText = isLoginMode ? 'Chưa có tài khoản?' : 'Đã có tài khoản?';
            document.getElementById('auth-switch-btn').innerText = isLoginMode ? 'Đăng ký' : 'Đăng nhập';
        }

        async function handleAuth() {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            const errorDiv = document.getElementById('auth-error');
            if(!email || !pass) return errorDiv.innerText = "Điền thiếu thông tin", errorDiv.classList.remove('hidden');
            
            const { error } = isLoginMode 
                ? await supabaseClient.auth.signInWithPassword({ email, password: pass })
                : await supabaseClient.auth.signUp({ email, password: pass });

            if (error) {
                errorDiv.innerText = error.message;
                errorDiv.classList.remove('hidden');
            } else {
                toggleAuthModal(false);
                checkSession(); 
            }
        }

        async function signOut() { await supabaseClient.auth.signOut(); checkSession(); }

        function switchTab(tabId) {
            if(tabId === 'feed') {
                document.getElementById('tab-feed').classList.replace('bg-transparent', 'bg-white/10');
                document.getElementById('tab-rank').classList.replace('bg-white/10', 'bg-transparent');
                document.getElementById('content-feed').classList.remove('hidden');
                document.getElementById('content-rank').classList.add('hidden');
            } else {
                document.getElementById('tab-rank').classList.replace('bg-transparent', 'bg-white/10');
                document.getElementById('tab-feed').classList.replace('bg-white/10', 'bg-transparent');
                document.getElementById('content-rank').classList.remove('hidden');
                document.getElementById('content-feed').classList.add('hidden');
            }
        }

        async function fetchPosts() {
            const { data, error } = await supabaseClient.from('posts').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('posts-container');
            if (error) return container.innerHTML = `<div class="text-red-400 text-xs p-2">Lỗi tải dữ liệu</div>`;
            if (data.length === 0) return container.innerHTML = '<div class="text-center text-gray-500 text-xs mt-6">Chưa có tín hiệu nào.</div>';

            container.innerHTML = ''; 
            data.forEach(post => {
                let forwardTestHtml = '';
                if (post.entry) {
                    let isLong = post.type === 'LONG';
                    let borderGlow = isLong ? 'border-blue-500/50' : 'border-pink-500/50';
                    let badgeStyle = isLong ? 'bg-blue-500/20 text-blue-400' : 'bg-pink-500/20 text-pink-400';
                    forwardTestHtml = `
                    <div class="bg-black/40 p-2.5 rounded-xl border-l-2 ${borderGlow} mt-2 text-xs">
                        <div class="font-bold mb-1.5 flex items-center gap-2">
                            <span class="px-1.5 py-0.5 rounded text-[9px] uppercase font-black ${badgeStyle}">${post.type}</span> 
                            <span class="font-mono">${post.symbol}</span>
                        </div>
                        <div class="grid grid-cols-3 gap-1 text-center">
                            <div class="bg-white/5 py-1 rounded">Entry<br><span class="font-mono font-bold text-white">${post.entry}</span></div>
                            <div class="bg-white/5 py-1 rounded">SL<br><span class="font-mono font-bold text-pink-400">${post.sl || '-'}</span></div>
                            <div class="bg-white/5 py-1 rounded">TP<br><span class="font-mono font-bold text-emerald-400">${post.tp || '-'}</span></div>
                        </div>
                    </div>`;
                }
                const div = document.createElement('div');
                div.className = 'bg-white/5 p-3 rounded-xl border border-white/10 text-xs';
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-bold text-blue-400">${post.author}</span>
                        <span class="text-[10px] text-gray-500 font-mono">${new Date(post.created_at).toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'})}</span>
                    </div>
                    <p class="text-gray-300 leading-relaxed">${post.content}</p>
                    ${forwardTestHtml}
                `;
                container.appendChild(div);
            });
        }

        async function submitPost() {
            if (!currentUser) return alert("Vui lòng đăng nhập!");
            const content = document.getElementById('input-content').value;
            if(!content.trim()) return alert("Nhập nội dung đi bạn!");

            const postData = { author: '@' + currentUser.email.split('@')[0], content: content };
            const entryVal = document.getElementById('input-entry').value;
            if (entryVal) {
                postData.symbol = document.getElementById('input-symbol').value;
                postData.type = document.getElementById('input-type').value;
                postData.entry = parseFloat(entryVal);
                let slVal = document.getElementById('input-sl').value; if(slVal) postData.sl = parseFloat(slVal);
                let tpVal = document.getElementById('input-tp').value; if(tpVal) postData.tp = parseFloat(tpVal);
            }

            await supabaseClient.from('posts').insert([postData]);
            document.getElementById('input-content').value = '';
            document.getElementById('input-entry').value = '';
            document.getElementById('input-sl').value = '';
            document.getElementById('input-tp').value = '';
        }

        supabaseClient.channel('custom-all-channel').on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => fetchPosts()).subscribe();
        window.onload = checkSession;
    </script>
</body>
</html>
