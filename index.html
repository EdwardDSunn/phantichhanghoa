<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMC Analytics & Forward Testing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white font-sans relative">
    <!-- Navbar -->
    <nav class="bg-gray-800 p-4 border-b border-gray-700 flex justify-between items-center">
        <div class="text-xl font-bold text-blue-400">Commodity Analytics (SMC)</div>
        <div class="flex space-x-4 text-sm font-medium items-center">
            <button class="hover:text-blue-400">Biểu đồ</button>
            <button class="hover:text-blue-400">Nhật ký Backtest</button>
            <!-- Khu vực User -->
            <div id="user-info" class="hidden flex items-center gap-3">
                <span id="user-email" class="text-gray-300 font-bold"></span>
                <button onclick="signOut()" class="text-red-400 hover:text-red-300 text-xs border border-red-500 px-2 py-1 rounded">Thoát</button>
            </div>
            <button id="btn-show-login" onclick="toggleAuthModal(true)" class="bg-blue-600 px-4 py-1.5 rounded hover:bg-blue-500 transition">Đăng nhập</button>
        </div>
    </nav>

    <div class="flex flex-col lg:flex-row h-screen p-2 gap-4">
        <!-- Cột trái -->
        <div class="w-full lg:w-2/3 flex flex-col">
            <div class="bg-gray-800 rounded-lg p-2 h-[65vh] shadow-lg border border-gray-700">
                <div class="tradingview-widget-container" style="height:100%;width:100%">
                  <div id="tradingview_7b27f" style="height:calc(100% - 32px);width:100%"></div>
                  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
                  <script type="text/javascript">
                  new TradingView.widget({
                  "autosize": true,
                  "symbol": "OANDA:XAGUSD",
                  "interval": "60",
                  "timezone": "Asia/Ho_Chi_Minh",
                  "theme": "dark",
                  "style": "1",
                  "locale": "vi_VN",
                  "enable_publishing": false,
                  "backgroundColor": "#1f2937",
                  "gridColor": "#374151",
                  "hide_top_toolbar": false,
                  "hide_legend": false,
                  "save_image": true,
                  "container_id": "tradingview_7b27f",
                  "toolbar_bg": "#1f2937",
                  "allow_symbol_change": true,
                  "details": true,
                  "watchlist": ["OANDA:XAGUSD", "TVC:COPPER", "TVC:PLATINUM", "OANDA:XAUUSD"]
                });
                  </script>
                </div>
            </div>
            
            <div class="mt-4 p-4 bg-gray-800 rounded-lg border border-gray-700 shadow-lg relative">
                <!-- Overlay chặn nếu chưa đăng nhập -->
                <div id="login-overlay" class="absolute inset-0 bg-gray-900 bg-opacity-80 flex items-center justify-center rounded-lg z-10 backdrop-blur-sm">
                    <div class="text-center">
                        <p class="mb-3 text-gray-300">Vui lòng đăng nhập để chia sẻ nhận định</p>
                        <button onclick="toggleAuthModal(true)" class="bg-blue-600 px-6 py-2 rounded font-bold hover:bg-blue-500">Đăng Nhập Ngay</button>
                    </div>
                </div>

                <h3 class="font-bold mb-2 flex justify-between items-center">
                    <span>Đăng nhận định mới</span>
                    <span id="posting-as" class="text-xs text-blue-400 font-normal"></span>
                </h3>
                <textarea id="input-content" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-gray-200 focus:outline-none focus:border-blue-500" rows="3" placeholder="Chia sẻ góc nhìn của bạn..."></textarea>
                
                <div id="forward-test-form" class="mt-2 p-3 bg-gray-900 border border-gray-700 rounded-lg hidden">
                    <div class="grid grid-cols-2 md:grid-cols-5 gap-2 text-sm">
                        <select id="input-symbol" class="bg-gray-800 border border-gray-700 rounded p-1.5 text-white focus:outline-none">
                            <option value="XAGUSD">XAGUSD (Bạc)</option>
                            <option value="XAUUSD">XAUUSD (Vàng)</option>
                            <option value="COPPER">COPPER (Đồng)</option>
                        </select>
                        <select id="input-type" class="bg-gray-800 border border-gray-700 rounded p-1.5 text-white focus:outline-none">
                            <option value="LONG">LONG</option>
                            <option value="SHORT">SHORT</option>
                        </select>
                        <input type="number" id="input-entry" placeholder="Giá Entry" class="bg-gray-800 border border-gray-700 rounded p-1.5 text-white w-full focus:outline-none">
                        <input type="number" id="input-sl" placeholder="Stop Loss" class="bg-gray-800 border border-gray-700 rounded p-1.5 text-white w-full focus:outline-none">
                        <input type="number" id="input-tp" placeholder="Take Profit" class="bg-gray-800 border border-gray-700 rounded p-1.5 text-white w-full focus:outline-none">
                    </div>
                </div>

                <div class="mt-3 flex justify-between items-center">
                    <button onclick="document.getElementById('forward-test-form').classList.toggle('hidden')" class="text-sm text-gray-400 hover:text-white flex items-center gap-1 border border-gray-600 px-3 py-1 rounded">
                        + Set Lệnh Forward Test
                    </button>
                    <button id="btn-submit" onclick="submitPost()" class="bg-blue-600 px-6 py-1.5 rounded text-sm hover:bg-blue-500 font-bold transition shadow-lg">ĐĂNG BÀI</button>
                </div>
            </div>
        </div>

        <!-- Cột phải -->
        <div class="w-full lg:w-1/3 bg-gray-800 rounded-lg p-4 shadow-lg border border-gray-700 overflow-y-auto h-[90vh]">
            <div class="flex justify-between items-center border-b border-gray-700 pb-3 mb-4 sticky top-0 bg-gray-800 z-10">
                <h2 class="text-lg font-bold">Cộng đồng & Forward Testing</h2>
                <span class="text-xs bg-green-900 text-green-400 px-2 py-1 rounded flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> Live
                </span>
            </div>
            <div id="posts-container" class="space-y-4">
                <div class="text-center text-gray-500 text-sm py-4">Đang tải dữ liệu...</div>
            </div>
        </div>
    </div>

    <!-- Modal Đăng nhập / Đăng ký -->
    <div id="auth-modal" class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center z-50">
        <div class="bg-gray-800 p-6 rounded-lg shadow-xl border border-gray-700 w-96">
            <div class="flex justify-between items-center mb-4">
                <h2 id="auth-title" class="text-xl font-bold">Đăng Nhập</h2>
                <button onclick="toggleAuthModal(false)" class="text-gray-400 hover:text-white">&times;</button>
            </div>
            <div class="space-y-3">
                <input type="email" id="auth-email" placeholder="Email của bạn" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:border-blue-500 outline-none">
                <input type="password" id="auth-pass" placeholder="Mật khẩu (ít nhất 6 ký tự)" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:border-blue-500 outline-none">
                
                <button id="btn-auth-action" onclick="handleAuth()" class="w-full bg-blue-600 py-2 rounded font-bold hover:bg-blue-500 mt-2">Đăng Nhập</button>
            </div>
            <div class="mt-4 text-center text-sm text-gray-400">
                <span id="auth-switch-text">Chưa có tài khoản?</span> 
                <button onclick="switchAuthMode()" id="auth-switch-btn" class="text-blue-400 font-bold hover:underline">Đăng ký ngay</button>
            </div>
            <div id="auth-error" class="mt-3 text-red-400 text-sm text-center hidden"></div>
        </div>
    </div>

    <script>
        // MÌNH ĐÃ ĐIỀN SẴN URL
        const SUPABASE_URL = 'https://spbiokurzoxupmksraoy.supabase.co';
        // BẠN DÁN API KEY VÀO ĐÂY GIỐNG LẦN TRƯỚC NHÉ:
        const SUPABASE_KEY = 'sb_publishable_SZjk9POzWzoqoZbvoaCSfg_a9btQLym';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let currentUser = null;
        let isLoginMode = true; // true: Đăng nhập, false: Đăng ký

        // KIỂM TRA TRẠNG THÁI ĐĂNG NHẬP KHI MỞ WEB
        async function checkSession() {
            const { data, error } = await supabase.auth.getSession();
            if (data.session) {
                currentUser = data.session.user;
                updateUIForUser();
            } else {
                currentUser = null;
                updateUIForGuest();
            }
            fetchPosts();
        }

        function updateUIForUser() {
            document.getElementById('btn-show-login').classList.add('hidden');
            document.getElementById('user-info').classList.remove('hidden');
            // Cắt phần tên trước chữ @ của email để làm nickname
            const nickname = '@' + currentUser.email.split('@')[0];
            document.getElementById('user-email').innerText = nickname;
            
            // Mở khóa khung đăng bài
            document.getElementById('login-overlay').classList.add('hidden');
            document.getElementById('posting-as').innerText = `Đăng bài dưới tên: ${nickname}`;
        }

        function updateUIForGuest() {
            document.getElementById('btn-show-login').classList.remove('hidden');
            document.getElementById('user-info').classList.add('hidden');
            // Khóa khung đăng bài
            document.getElementById('login-overlay').classList.remove('hidden');
        }

        // LOGIC AUTH MODAL
        function toggleAuthModal(show) {
            const modal = document.getElementById('auth-modal');
            if(show) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                document.getElementById('auth-error').classList.add('hidden');
            }
        }

        function switchAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? 'Đăng Nhập' : 'Tạo Tài Khoản Mới';
            document.getElementById('btn-auth-action').innerText = isLoginMode ? 'Đăng Nhập' : 'Đăng Ký';
            document.getElementById('auth-switch-text').innerText = isLoginMode ? 'Chưa có tài khoản?' : 'Đã có tài khoản?';
            document.getElementById('auth-switch-btn').innerText = isLoginMode ? 'Đăng ký ngay' : 'Đăng nhập';
            document.getElementById('auth-error').classList.add('hidden');
        }

        async function handleAuth() {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            const errorDiv = document.getElementById('auth-error');
            
            if(!email || !pass) {
                errorDiv.innerText = "Vui lòng nhập đủ Email và Mật khẩu";
                errorDiv.classList.remove('hidden');
                return;
            }

            document.getElementById('btn-auth-action').innerText = 'Đang xử lý...';
            errorDiv.classList.add('hidden');

            let error = null;
            if (isLoginMode) {
                const res = await supabase.auth.signInWithPassword({ email, password: pass });
                error = res.error;
            } else {
                const res = await supabase.auth.signUp({ email, password: pass });
                error = res.error;
            }

            if (error) {
                errorDiv.innerText = error.message;
                errorDiv.classList.remove('hidden');
                document.getElementById('btn-auth-action').innerText = isLoginMode ? 'Đăng Nhập' : 'Đăng Ký';
            } else {
                toggleAuthModal(false);
                checkSession(); // Cập nhật lại giao diện
            }
        }

        async function signOut() {
            await supabase.auth.signOut();
            checkSession();
        }

        // TẢI BÀI VIẾT (Giữ nguyên như cũ)
        async function fetchPosts() {
            const { data, error } = await supabase
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });
            
            const container = document.getElementById('posts-container');
            if (error) {
                container.innerHTML = `<div class="text-center text-red-400 text-sm">Lỗi tải dữ liệu: ${error.message}</div>`;
                return;
            }
            container.innerHTML = ''; 
            if(data.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 text-sm mt-10">Chưa có nhận định nào.</div>';
                return;
            }

            data.forEach(post => {
                let forwardTestHtml = '';
                if (post.entry) {
                    let isLong = post.type === 'LONG';
                    let typeColor = isLong ? 'border-blue-500' : 'border-red-500';
                    let badgeColor = isLong ? 'bg-blue-900 text-blue-300' : 'bg-red-900 text-red-300';
                    
                    forwardTestHtml = `
                    <div class="bg-gray-800 p-3 rounded text-sm border-l-4 ${typeColor} mt-3">
                        <div class="font-bold text-gray-200 mb-1 flex items-center gap-2">
                            <span class="px-2 py-0.5 rounded text-xs ${badgeColor}">${post.type}</span> 
                            ${post.symbol}
                        </div>
                        <div class="grid grid-cols-3 gap-2 text-center text-xs mt-2">
                            <div class="bg-gray-700 py-1.5 rounded">Entry<br><span class="font-bold text-white text-sm">${post.entry}</span></div>
                            <div class="bg-gray-700 py-1.5 rounded">SL<br><span class="font-bold text-red-400 text-sm">${post.sl || '-'}</span></div>
                            <div class="bg-gray-700 py-1.5 rounded">TP<br><span class="font-bold text-green-400 text-sm">${post.tp || '-'}</span></div>
                        </div>
                    </div>`;
                }

                const dateObj = new Date(post.created_at);
                const timeStr = dateObj.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
                const dateStr = dateObj.toLocaleDateString('vi-VN');
                
                const postElement = document.createElement('div');
                postElement.className = 'bg-gray-900 p-4 rounded-lg border border-gray-700 shadow-md';
                postElement.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-sm font-bold text-blue-400">${post.author}</span>
                        <span class="text-xs text-gray-500">${timeStr} - ${dateStr}</span>
                    </div>
                    <p class="text-sm text-gray-300 leading-relaxed whitespace-pre-wrap">${post.content}</p>
                    ${forwardTestHtml}
                `;
                container.appendChild(postElement);
            });
        }

        // ĐĂNG BÀI (Có kiểm tra Auth)
        async function submitPost() {
            if (!currentUser) {
                alert("Vui lòng đăng nhập!");
                return;
            }

            const content = document.getElementById('input-content').value;
            const btn = document.getElementById('btn-submit');
            
            if(!content.trim()) {
                alert("Bạn chưa nhập nội dung phân tích!");
                return;
            }

            const nickname = '@' + currentUser.email.split('@')[0];
            const postData = {
                author: nickname, // Lấy tên từ tài khoản đang đăng nhập
                content: content
            };

            const entryVal = document.getElementById('input-entry').value;
            if (entryVal) {
                postData.symbol = document.getElementById('input-symbol').value;
                postData.type = document.getElementById('input-type').value;
                postData.entry = parseFloat(entryVal);
                
                let slVal = document.getElementById('input-sl').value;
                if(slVal) postData.sl = parseFloat(slVal);
                
                let tpVal = document.getElementById('input-tp').value;
                if(tpVal) postData.tp = parseFloat(tpVal);
            }

            btn.innerText = 'Đang đẩy...';
            btn.disabled = true;

            const { error } = await supabase.from('posts').insert([postData]);

            btn.innerText = 'ĐĂNG BÀI';
            btn.disabled = false;

            if (error) {
                alert("Lỗi khi lưu dữ liệu: " + error.message);
            } else {
                document.getElementById('input-content').value = '';
                document.getElementById('input-entry').value = '';
                document.getElementById('input-sl').value = '';
                document.getElementById('input-tp').value = '';
                fetchPosts();
            }
        }

        window.onload = checkSession;
    </script>
</body>
</html>
